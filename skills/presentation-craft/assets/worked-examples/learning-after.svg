<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376b73"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#f4f1e9"/><text x="50" y="80" font-family="Arial,sans-serif" font-size="43" fill="#142b3b" font-weight="normal"><tspan x="50" dy="0">Скидка 20%: сначала находим сумму скидки</tspan></text><text x="50" y="190" font-family="Arial,sans-serif" font-size="25" fill="#142b3b" font-weight="normal"><tspan x="50" dy="0">Исходная цена</tspan></text><text x="50" y="260" font-family="Arial,sans-serif" font-size="68" fill="#142b3b" font-weight="normal"><tspan x="50" dy="0">1000 ₽</tspan></text><rect x="50" y="310" width="850" height="80" fill="#164a55"/><text x="78" y="365" font-family="Arial,sans-serif" font-size="43" fill="white" font-weight="normal"><tspan x="78" dy="0">1000 × 20 / 100 = 200 ₽</tspan></text><rect x="730" y="310" width="170" height="80" fill="#d88b41"/><text x="50" y="470" font-family="Arial,sans-serif" font-size="58" fill="#142b3b" font-weight="normal"><tspan x="50" dy="0">1000 − 200 = 800 ₽</tspan></text><text x="50" y="555" font-family="Arial,sans-serif" font-size="29" fill="#142b3b" font-weight="normal"><tspan x="50" dy="0">Попробуй: цена 1500 ₽, скидка 20%. Сколько платить?</tspan></text><text x="50" y="625" font-family="Arial,sans-serif" font-size="26" fill="#526873" font-weight="normal"><tspan x="50" dy="0">Проверка: скидка 300 ₽; платить 1200 ₽</tspan></text><text x="50" y="687" font-family="Arial,sans-serif" font-size="16" fill="#61717a" font-weight="normal"><tspan x="50" dy="0">Учебный пример · все данные вымышлены</tspan></text></svg>