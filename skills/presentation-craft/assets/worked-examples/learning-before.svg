<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376b73"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#f4f1e9"/><text x="50" y="90" font-family="Arial,sans-serif" font-size="48" fill="#142b3b" font-weight="normal"><tspan x="50" dy="0">Проценты и скидки</tspan></text><text x="50" y="220" font-family="Arial,sans-serif" font-size="34" fill="#142b3b" font-weight="normal"><tspan x="50" dy="0">Чтобы вычислить скидку, нужно умножить</tspan><tspan x="50" dy="45.900000000000006">исходную цену на процент скидки,</tspan><tspan x="50" dy="45.900000000000006">разделить на сто и вычесть результат</tspan><tspan x="50" dy="45.900000000000006">из исходной цены.</tspan></text><text x="50" y="540" font-family="Arial,sans-serif" font-size="32" fill="#142b3b" font-weight="normal"><tspan x="50" dy="0">При скидке 20% товар стоит дешевле</tspan></text><text x="50" y="687" font-family="Arial,sans-serif" font-size="16" fill="#61717a" font-weight="normal"><tspan x="50" dy="0">Учебный пример · все данные вымышлены</tspan></text></svg>